# Copy this file and set `app` to YOUR Fly.io app name (`fly apps create <name>`).
# See README.md for deploy notes. Do not point this at an existing private deployment.

app = 'your-longbnb-app'
primary_region = 'sjc'

[build]

[env]
  CITIES = 'San-Francisco--CA,Oakland--CA,Daly-City--CA,New-York--NY'
  DATA_DIR = '/data'
  MIN_RUNWAY = '28'
  PRICE_BANDS = '0-1100,1100-1600,1600-2400,2400-3500,3500-5200,5200-'
  PORT = '8080'
  WINDOW_DAYS = '48'

[http_service]
  internal_port = 8080
  force_https = true
  # suspend (not stop) so an in-flight harvest isn't killed when the tab closes;
  # suspended machines resume with process state intact on the next request
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1

[mounts]
  source = 'longbnb_data'
  destination = '/data'
